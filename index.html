<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gridiron Europe Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*{box-sizing:border-box} body{margin:0}
/* Layout: full-height split, map canvas left, scouting-sheet sidebar right; stacks on phones */
:root{
  --bg:#eef0ec; --panel:#f8f9f6; --ink:#17201c; --muted:#5d6862; --line:#d3d8d1;
  --land:#dde2da; --land-on:#c9d9c7; --sea:#e6ebe7; --border-land:#b9c1b8;
  --accent:#b8202f; --accent-ink:#ffffff; --gold:#a87a12;
  --display:"Saira Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --panel:#171d19; --ink:#e7ece8; --muted:#97a39c; --line:#2a332e;
  --land:#232b26; --land-on:#2c4234; --sea:#141a16; --border-land:#3a453e;
  --accent:#e04a57; --accent-ink:#ffffff; --gold:#e0b04a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --panel:#171d19; --ink:#e7ece8; --muted:#97a39c; --line:#2a332e;
  --land:#232b26; --land-on:#2c4234; --sea:#141a16; --border-land:#3a453e;
  --accent:#e04a57; --accent-ink:#ffffff; --gold:#e0b04a; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px}
.app{display:flex;height:100%;min-height:0}
.mapwrap{position:relative;flex:1;min-width:0;background:var(--sea);overflow:hidden}
svg#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg#map:active{cursor:grabbing}
.country{fill:var(--land);stroke:var(--border-land);stroke-width:.6;vector-effect:non-scaling-stroke}
.country.on{fill:var(--land-on)}
.mk circle{stroke:var(--panel);vector-effect:non-scaling-stroke;cursor:pointer}
.mk .sr{fill:var(--accent);stroke-width:1.5}
.mk .pro{fill:var(--ink);stroke-width:1.5}
.mk .jr{fill:var(--panel);stroke:var(--accent);stroke-width:2}
.mk .champ{fill:none;stroke:var(--gold);stroke-width:2}
.mk.sel .sr,.mk.sel .jr,.mk.sel .pro{stroke:var(--ink);stroke-width:2.5}
.mk text{font-family:var(--display);font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:3px;pointer-events:none}
.mk.dim{opacity:.18}
.legend{position:absolute;left:16px;bottom:16px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:grid;gap:6px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:8px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.zoom{position:absolute;right:16px;top:16px;display:grid;gap:4px}
.zoom button{width:34px;height:34px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;font-size:18px;cursor:pointer;font-family:var(--mono)}
.zoom button:focus-visible,.chip:focus-visible,.row:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

aside{width:380px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.head{padding:20px 20px 14px;border-bottom:1px solid var(--line);display:grid;gap:10px}
h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;letter-spacing:.01em;margin:0;text-transform:uppercase;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.meta{display:flex;gap:16px;font-family:var(--mono);font-size:12px;color:var(--muted);flex-wrap:wrap}
.meta b{color:var(--ink);font-weight:500}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.controls{padding:12px 20px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
input[type=search]{width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 11px;font:500 12px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.detail{padding:16px 20px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.detail h2{font-family:var(--display);font-weight:800;font-size:24px;margin:0;line-height:1.05;text-transform:uppercase}
.detail .sub{color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--gold);color:var(--panel)}
.small{font-size:12px;color:var(--muted)}
.small a,.kv a{color:var(--accent)}
.muted{color:var(--muted)} .addr{font-size:12px;color:var(--muted)}
.list{overflow:auto;flex:1;min-height:0}
.group{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 20px 6px}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 20px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.row:hover{background:var(--bg)} .row.sel{background:var(--bg);box-shadow:inset 3px 0 0 var(--accent)}
.row .pos{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .nm{font-weight:600;min-width:0} .row .city{font-size:12px;color:var(--muted)}
.row .rec{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.foot{padding:12px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.foot a{color:inherit}
@media (max-width:760px){
  .app{flex-direction:column}
  .mapwrap{flex:none;height:52vh}
  aside{width:auto;border-left:0;border-top:1px solid var(--line);flex:1}
  .legend{left:12px;bottom:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <div class="mapwrap">
    <svg id="map" viewBox="0 0 1000 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Map of American football teams in Europe">
      <g id="vp"><g id="land"></g><g id="marks"></g></g>
    </svg>
    <div class="zoom">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">−</button>
      <button id="zpl" aria-label="Zoom to Poland" style="font-size:11px">PL</button>
    </div>
    <div class="legend">
      <span><i class="dot" style="background:var(--ink)"></i>AFLE pro team</span>
      <span><i class="dot" style="background:var(--accent)"></i>PFL senior team</span>
      <span><i class="dot" style="background:var(--panel);border:2px solid var(--accent);box-sizing:border-box"></i>U-20 program only</span>
      <span><i class="dot" style="border:2px solid var(--gold);box-sizing:border-box"></i>2026 champion</span>
    </div>
  </div>
  <aside>
    <div class="head">
      <h1>Gridiron <em>Europe</em></h1>
      <div class="meta"><span><b id="nTeams">0</b> teams mapped</span><span><b>1</b> of 41 countries</span><span>Updated <b id="updated">…</b></span></div>
      <div class="progress" title="Countries covered out of 41 with American football"><i style="width:2.4%"></i></div>
    </div>
    <div class="controls">
      <input id="q" type="search" placeholder="Search team or city" aria-label="Search team or city">
      <div class="chips" role="group" aria-label="Filter">
        <button class="chip" data-f="all" aria-pressed="true">All</button>
        <button class="chip" data-f="afle">AFLE</button>
        <button class="chip" data-f="pfl">PFL</button>
        <button class="chip" data-f="u20">Has U-20</button>
      </div>
    </div>
    <div class="detail" id="detail"></div>
    <div class="list" id="list"></div>
    <div class="foot">Data: <a href="https://polskafutbolliga.pl/pfl2026/" target="_blank" rel="noopener">polskafutbolliga.pl</a>. Map pins are city-level; addresses are in each team card. Prototype, Poland only.</div>
  </aside>
</div>

let TEAMS = [];

const proj = d3.geoConicConformal().rotate([-15,0]).parallels([43,62]).scale(1100).translate([500,450]).center([0,52]);
const svg = d3.select("#map"), vp = d3.select("#vp");
let mk, k=1, sel=null, filter="all", query="";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const markClass = t => t.league==="AFLE" ? "pro" : t.league==="PFL" ? "sr" : "jr";

function drawLand(){
  const covered = new Set(TEAMS.map(t=>t.country));
  d3.select("#land").selectAll("path").data(COUNTRIES).join("path")
    .attr("class",d=>"country"+(covered.has(d.n)?" on":"")).attr("d",d=>d.d)
    .append("title").text(d=>d.n);
}
function drawMarks(){
  const seen = {};
  TEAMS.forEach(t=>{const [x,y]=proj([t.lng,t.lat]);const key=t.lat+","+t.lng;const n=seen[key]=(seen[key]||0)+1;t.x=x+(n-1)*3.2;t.y=y+(n-1)*2.4;});
  mk = d3.select("#marks").selectAll("g").data(TEAMS).join("g").attr("class","mk")
    .attr("transform",d=>`translate(${d.x},${d.y})`).on("click",(e,d)=>select(d.id,true));
  mk.filter(d=>d.champ).append("circle").attr("class","champ");
  mk.append("circle").attr("class",markClass);
  mk.append("title").text(d=>`${d.name} (${d.city})`);
  mk.append("text").text(d=>d.name.replace(/^(Warsaw|AZS UWM Olsztyn|Silesia) /,"").split(" ")[0]+(d.id==="panthers2"?" II":""));
}
function sizeMarks(){
  if(!mk) return;
  const r=5.5/k;
  mk.select(".sr").attr("r",r); mk.select(".pro").attr("r",r*1.15); mk.select(".jr").attr("r",r*.9); mk.select(".champ").attr("r",r*1.7);
  mk.select("text").attr("x",r*1.6).attr("y",r*.6).attr("font-size",12/k).style("display",k>3.2?null:"none").style("stroke-width",3/k+"px");
}
const zoom = d3.zoom().scaleExtent([1,40]).on("zoom",e=>{vp.attr("transform",e.transform);k=e.transform.k;sizeMarks();});
svg.call(zoom);
function zoomPoland(dur=0){
  const pl=COUNTRIES.find(c=>c.n==="Poland");const tmp=d3.select("#land").append("path").attr("d",pl.d);
  const b=tmp.node().getBBox();tmp.remove();
  const s=Math.min(1000/(b.width*1.35),900/(b.height*1.35));
  const t=d3.zoomIdentity.translate(500-s*(b.x+b.width/2),450-s*(b.y+b.height/2)).scale(s);
  (dur?svg.transition().duration(dur):svg).call(zoom.transform,t);
}
d3.select("#zin").on("click",()=>svg.transition().duration(250).call(zoom.scaleBy,1.6));
d3.select("#zout").on("click",()=>svg.transition().duration(250).call(zoom.scaleBy,1/1.6));
d3.select("#zpl").on("click",()=>zoomPoland(400));

function visible(t){
  if(filter==="pfl"&&t.league!=="PFL")return false;
  if(filter==="afle"&&t.league!=="AFLE")return false;
  if(filter==="u20"&&!t.u20)return false;
  if(query&&!(t.name+" "+t.city).toLowerCase().includes(query))return false;
  return true;
}
function linksHtml(l){
  const items=[["website","Website"],["instagram","Instagram"],["wikipedia","Wikipedia"]]
    .filter(([key])=>l&&l[key]).map(([key,label])=>`<a href="${esc(l[key])}" target="_blank" rel="noopener">${label}</a>`);
  return items.length?items.join(" · "):`<span class="muted">Not added yet</span>`;
}
function render(){
  const v=TEAMS.filter(visible);
  document.getElementById("nTeams").textContent=TEAMS.length;
  if(mk) mk.classed("dim",d=>!visible(d)).classed("sel",d=>d.id===sel);
  const pro=v.filter(t=>t.league==="AFLE"), sr=v.filter(t=>t.league==="PFL").sort((a,b)=>a.pfl.pos-b.pfl.pos), jr=v.filter(t=>!t.league);
  const row=t=>`<button class="row${t.id===sel?" sel":""}" data-id="${t.id}"><span class="pos">${t.pfl?String(t.pfl.pos).padStart(2,"0"):t.league==="AFLE"?"PRO":"U20"}</span><span class="nm">${esc(t.name)}<div class="city">${esc(t.city)}</div></span><span class="rec">${t.pfl?t.pfl.w+"–"+t.pfl.l:""}</span></button>`;
  let h="";
  if(pro.length)h+=`<div class="group">AFLE · European pro league</div>`+pro.map(row).join("");
  if(sr.length)h+=`<div class="group">Polska Futbol Liga · 2026 regular season</div>`+sr.map(row).join("");
  if(jr.length)h+=`<div class="group">U-20 programs, no senior team</div>`+jr.map(row).join("");
  if(!v.length)h=`<div class="group">No teams match “${esc(query)}”</div>`;
  const L=document.getElementById("list");L.innerHTML=h;
  L.querySelectorAll(".row").forEach(b=>b.onclick=()=>select(b.dataset.id,false));
  const t=TEAMS.find(x=>x.id===sel), D=document.getElementById("detail");
  if(!t){D.innerHTML=`<div class="small">Select a team on the map or in the list. Drag to pan, scroll or pinch to zoom.</div>`;return;}
  const leagueLabel = t.league==="AFLE"?"AFLE (pan-European pro)":t.league==="PFL"?"PFL (Polish top tier)":"Junior only";
  const f=t.field;
  D.innerHTML=`${t.champ?'<div><span class="badge">2026 champion</span></div>':""}<h2>${esc(t.name)}</h2><div class="sub">${esc(t.city)}, ${esc(t.country)}</div>
  <dl class="kv">
   <dt>League</dt><dd>${leagueLabel}</dd>
   ${t.pfl?`<dt>2026 record</dt><dd>${t.pfl.w}–${t.pfl.l} · ${t.pfl.pos}${["st","nd","rd"][t.pfl.pos-1]||"th"} of 13</dd>`:""}
   ${t.playoff?`<dt>Playoffs</dt><dd>${esc(t.playoff)}</dd>`:""}
   <dt>U-20 team</dt><dd>${t.u20?"Yes, PFL-J 2026":"Not in PFL-J 2026"}</dd>
   <dt>Home field</dt><dd>${f?`${esc(f.name)}<br><span class="addr">${esc(f.address)}</span>${f.note?`<br><span class="muted">${esc(f.note)}</span>`:""}`:`<span class="muted">Not added yet</span>`}</dd>
   <dt>Links</dt><dd>${linksHtml(t.links)}</dd>
  </dl>${t.teamNote?`<div class="small">${esc(t.teamNote)}</div>`:""}`;
}
function select(id,fromMap){
  sel=sel===id&&fromMap?null:id;render();
  if(sel&&!fromMap){const t=TEAMS.find(x=>x.id===id);const s=Math.max(k,6);
    svg.transition().duration(400).call(zoom.transform,d3.zoomIdentity.translate(500-s*t.x,450-s*t.y).scale(s));}
  if(sel&&fromMap){const r=document.querySelector(`.row[data-id="${id}"]`);if(r)r.scrollIntoView({block:"nearest"});}
}
document.getElementById("q").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();render();});
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{filter=c.dataset.f;document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===c));render();});

drawLand(); zoomPoland();
fetch("teams.json").then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(data=>{
  TEAMS=data.teams;
  document.getElementById("updated").textContent=new Date(data.updated+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
  drawLand(); drawMarks(); sizeMarks(); render();
}).catch(()=>{
  document.getElementById("detail").innerHTML=`<div class="small">Couldn't load teams.json. Make sure it sits in the same folder as this page. Opening the page straight from your computer's files blocks this, so test it on the live site.</div>`;
});
</script>
</body>
</html>
